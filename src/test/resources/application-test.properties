spring.application.name=publication-api-test

# Isolated in-memory database
spring.datasource.url=jdbc:h2:mem:publication_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Safe test-only JWT secret (32 bytes, Base64)
jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt.expiration=86400000

# Safe test-only AES key (32 bytes, Base64)
app.encryption-key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU=

# CORS
app.cors.allowed-origin=http://localhost:5173

# n8n - dummy values, no real external call during context startup
app.n8n.webhook-url=http://localhost:5678/webhook/publications
app.n8n.shared-secret=test-only-n8n-secret-do-not-use-in-production
app.public-url=http://localhost:8080

# LinkedIn - test only
app.linkedin.client-id=test-linkedin-client
app.linkedin.client-secret=test-linkedin-secret
app.linkedin.redirect-uri=http://localhost:8080/api/accounts/linkedin/callback
app.linkedin.api-version=202608