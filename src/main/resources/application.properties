spring.application.name=publication-api

server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/publication_db}
spring.datasource.username=${DB_USERNAME:springadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT
# Must be a Base64 encoded 256-bit or stronger secret.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Separate encryption key for third-party credentials.
# Must be Base64 encoded 32 bytes / 256 bits.
app.encryption-key=${APP_ENCRYPTION_KEY}

# Frontend
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# n8n
app.n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/publications}
app.n8n.shared-secret=${N8N_SHARED_SECRET}

# URL that n8n can use to call this API back
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Avoid exposing JDBC connection details in application logs
logging.level.org.hibernate.orm.connections.pooling=WARN

# LinkedIn OAuth
app.linkedin.client-id=${LINKEDIN_CLIENT_ID}
app.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET}
app.linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI}
app.linkedin.api-version=${LINKEDIN_API_VERSION:202608}

# Spring AI - Google Gemini
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.5}