spring.application.name=publication-api
# Configuration de la connexion MySQL
spring.datasource.url=jdbc:mariadb://localhost:3306/publication_db
spring.datasource.username=springadmin
spring.datasource.password=springadmin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuration Hibernate / JPA (crée automatiquement les tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clé secrète pour la signature des tokens JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Expiration du token en millisecondes (86400000 ms = 24 heures)
jwt.expiration=86400000